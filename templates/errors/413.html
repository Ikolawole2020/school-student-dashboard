{% extends 'base.html' %} {% block title %}File Too Large{% endblock %} {% block
content %}
<div class="d-flex align-items-center justify-content-center error-page">
  <div class="text-center">
    <div class="error-code">413</div>
    <h2 class="mb-2">That file is too large</h2>
    <p class="text-muted mb-4">
      Profile pictures must be 4MB or smaller. Please choose a smaller image.
    </p>
    <a href="{{ request.referrer or url_for('public.home') }}" class="btn btn-brand px-4">
      <i class="fa-solid fa-arrow-left me-1"></i> Go back
    </a>
  </div>
</div>
{% endblock %}
