{% extends 'base.html' %} {% block title %}Something Went Wrong{% endblock %} {%
block content %}
<div class="d-flex align-items-center justify-content-center error-page">
  <div class="text-center">
    <div class="error-code">500</div>
    <h2 class="mb-2">Something went wrong</h2>
    <p class="text-muted mb-4">
      An unexpected error occurred. Your work was not saved, so please try again.
    </p>
    <a href="{{ url_for('public.home') }}" class="btn btn-brand px-4">
      <i class="fa-solid fa-house me-1"></i> Back to home
    </a>
  </div>
</div>
{% endblock %}
